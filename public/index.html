<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#171311">
<title>恋場所 〜恋の決まり手〜 | Prologue</title>
<style>
:root{
  --ink:#1f1916;--paper:#fffaf2;--cream:#f0e4d3;--red:#8d2f2f;--gold:#c49a55;
  --muted:#786c64;--line:#decdb9;--deep:#171311;--glass:rgba(255,250,242,.91);
  --shadow:0 16px 40px rgba(36,22,14,.22);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#1d1815;color:var(--ink)}
button,textarea{font:inherit}
button{cursor:pointer}
#app{min-height:100dvh;max-width:620px;margin:auto;background:var(--paper);position:relative;overflow:hidden;box-shadow:0 0 60px rgba(0,0,0,.4)}
.topbar{position:absolute;inset:0 0 auto 0;z-index:30;padding:10px 12px;display:flex;align-items:flex-start;justify-content:space-between;pointer-events:none}
.brand{color:#fff;text-shadow:0 2px 10px rgba(0,0,0,.55)}
.brand b{display:block;font-size:17px;letter-spacing:.03em}.brand span{font-size:10px;opacity:.78}
.status{pointer-events:auto;background:rgba(20,16,13,.66);color:#fff;border:1px solid rgba(255,255,255,.14);border-radius:999px;padding:6px 9px;font-size:10px;backdrop-filter:blur(8px)}
.status.live{background:rgba(49,90,61,.82)}.status.mock{background:rgba(115,78,38,.82)}
.stage{height:58dvh;min-height:400px;position:relative;overflow:hidden;background:#aaa}
.bg{position:absolute;inset:0;transition:filter .45s,opacity .45s,transform .7s;background-size:cover;background-position:center}
.bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(10,9,8,.08) 45%,rgba(10,7,5,.5) 100%)}
.bg.day1{background:
radial-gradient(circle at 72% 18%,rgba(255,239,190,.46),transparent 23%),
linear-gradient(90deg,rgba(102,76,52,.32) 0 3%,transparent 3% 22%,rgba(100,75,50,.26) 22% 25%,transparent 25% 77%,rgba(100,75,50,.26) 77% 80%,transparent 80%),
linear-gradient(#dfc9a5 0 24%,#83664d 24% 27%,#eee4d2 27% 72%,#ad8a65 72% 75%,#69523f 75%)}
.bg.day2{background:
radial-gradient(circle at 17% 19%,rgba(255,255,255,.7),transparent 22%),
repeating-linear-gradient(90deg,rgba(248,246,238,.7) 0 70px,rgba(104,91,73,.12) 70px 74px),
linear-gradient(#d6d6d0 0 19%,#6c746f 19% 22%,#dfdcd4 22% 77%,#716b62 77%)}
.bg.day3{background:
radial-gradient(circle at 80% 18%,rgba(255,210,120,.42),transparent 15%),
linear-gradient(#263143 0 40%,#5a5660 40% 42%,#c7b79d 42% 76%,#6f5946 76%)}
.bg.blur{filter:blur(3px) brightness(.72);transform:scale(1.03)}
.location{position:absolute;left:13px;top:68px;z-index:10;color:#fff;background:rgba(26,21,18,.68);padding:6px 9px;border-radius:999px;font-size:11px;backdrop-filter:blur(6px)}
.stats{position:absolute;right:13px;top:68px;z-index:10;color:#fff;text-align:right;font-size:10px;text-shadow:0 2px 9px rgba(0,0,0,.65)}
.stats b{font-size:13px;display:block}
.char{position:absolute;left:50%;bottom:-17px;transform:translateX(-50%);width:min(92%,465px);height:95%;z-index:5;transition:transform .38s ease,filter .35s ease,opacity .35s}
.char.close{transform:translateX(-50%) scale(1.055)}
.char.lookaway{transform:translateX(-52%) scale(1.01)}
.char svg{width:100%;height:100%;display:block;filter:drop-shadow(0 18px 14px rgba(0,0,0,.28))}
.char.bump{animation:bump .4s ease}@keyframes bump{0%,100%{transform:translateX(-50%)}45%{transform:translateX(-50%) scale(1.04)}}
.emotiontag{position:absolute;right:15px;top:110px;z-index:12;background:rgba(255,250,242,.92);border:1px solid rgba(255,255,255,.6);border-radius:999px;padding:6px 9px;font-size:10px;opacity:0;transform:translateY(5px);transition:.25s;box-shadow:0 5px 14px rgba(0,0,0,.14)}
.emotiontag.show{opacity:1;transform:none}
.scene-title{position:absolute;left:14px;bottom:16px;z-index:9;color:#fff;text-shadow:0 2px 12px rgba(0,0,0,.7)}
.scene-title .day{font-size:11px;letter-spacing:.22em;opacity:.77}.scene-title h1{margin:4px 0 0;font-size:24px}
.panel{min-height:42dvh;background:var(--paper);position:relative;z-index:15;border-radius:24px 24px 0 0;margin-top:-19px;padding:18px 13px calc(166px + env(safe-area-inset-bottom))}
.scenelead{background:#fff;border:1px solid var(--line);border-radius:16px;padding:11px 12px;margin-bottom:10px;font-size:12px;line-height:1.6;color:var(--muted)}
.log{display:grid;gap:9px}
.bubble{max-width:90%;padding:11px 13px;border-radius:18px;font-size:15px;line-height:1.65;white-space:pre-wrap;box-shadow:0 4px 15px rgba(42,24,13,.045)}
.bubble .speaker{font-size:10px;font-weight:900;opacity:.65;margin-bottom:3px}
.gono{justify-self:start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}
.you{justify-self:end;background:var(--red);color:#fff;border-bottom-right-radius:5px}
.narr{max-width:100%;justify-self:stretch;text-align:center;background:#fff5d8;border:1px solid #e9d3a2;color:#655744;font-size:12px}
.typing{display:flex;gap:5px;padding:5px 0}.typing i{width:6px;height:6px;border-radius:50%;background:#76695f;animation:dot 1s infinite}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes dot{0%,60%,100%{opacity:.2;transform:none}30%{opacity:1;transform:translateY(-4px)}}
.controls{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(620px,100%);z-index:40;background:rgba(255,250,242,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line);padding:8px 10px calc(9px + env(safe-area-inset-bottom))}
.prompt{font-size:11px;color:var(--muted);margin:0 2px 5px}
textarea{width:100%;height:67px;border:1px solid #cdbca7;border-radius:15px;background:#fff;padding:10px 11px;resize:none;outline:none;font-size:15px}
textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(196,154,85,.13)}
.actions{display:flex;gap:7px;margin-top:7px}
button{border:0;border-radius:13px;padding:10px 11px;font-weight:850;background:#eadfce;color:var(--ink)}
.send{flex:1;background:var(--red);color:#fff}.gold{background:#d8b46a}
button:disabled,textarea:disabled{opacity:.45}
.next{display:flex;justify-content:flex-end;margin-top:10px}.next button{background:#332821;color:#fff}
.overlay{position:fixed;inset:0;z-index:80;background:rgba(20,15,12,.8);display:none;align-items:center;justify-content:center;padding:15px}
.overlay.show{display:flex}.modal{width:min(520px,100%);max-height:84dvh;overflow:auto;background:var(--paper);border-radius:22px;padding:18px;box-shadow:var(--shadow)}
.memory{background:#fff;border:1px solid var(--line);border-radius:12px;padding:9px 10px;margin:7px 0;font-size:12px}
.transition{position:fixed;inset:0;z-index:90;background:#201815;color:#fff;display:none;align-items:center;justify-content:center;text-align:center}.transition.show{display:flex}
.transition .n{font-size:46px;font-weight:950}.transition .t{font-size:14px;opacity:.74;margin-top:4px}
.end{padding:20px 5px;text-align:center}.end h1{font-size:30px}.quote{background:#fff;border:1px solid var(--line);border-radius:16px;padding:13px;margin:10px 0;text-align:left}
.hidden{display:none!important}
@media(max-height:730px){.stage{height:52dvh;min-height:350px}.char{width:82%}.panel{padding-bottom:155px}}
</style>
</head>
<body>
<div id="app">
  <div class="topbar">
    <div class="brand"><b>恋場所 〜恋の決まり手〜</b><span>Prologue / 剛ノ山編</span></div>
    <div class="status mock" id="aiStatus">DEMO AI</div>
  </div>

  <section class="stage">
    <div id="bg" class="bg day1"></div>
    <div class="location" id="location">雷神部屋・玄関</div>
    <div class="stats"><b id="record">1勝0敗</b><span id="condition">平常</span></div>
    <div id="emotionTag" class="emotiontag">……</div>
    <div id="char" class="char"><div id="charArt" style="width:100%;height:100%"></div></div>
    <div class="scene-title"><div class="day" id="dayLabel">DAY 1</div><h1 id="sceneTitle">初対面</h1></div>
  </section>

  <main class="panel">
    <div class="scenelead" id="lead"></div>
    <div class="log" id="log"></div>
  </main>

  <div class="controls" id="controls">
    <div class="prompt" id="prompt">あなたなら、何と言う？</div>
    <textarea id="input" placeholder="自分の言葉で話す"></textarea>
    <div class="actions">
      <button id="memoryBtn">記憶</button>
      <button class="gold" id="restartBtn">最初から</button>
      <button class="send" id="sendBtn">話す</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="transition" id="transition"><div><div class="n" id="transN"></div><div class="t" id="transT"></div></div></div>

<script src="./config.js"></script>
<script>
const API_BASE=(window.KOIBASHO_API_BASE||"").replace(/\/$/,"");
const STATE_KEY="koibasho_prologue_v1";
const initial={
 day:1,turn:0,wins:1,losses:0,injury:0,fatigue:8,
 affection:6,trust:5,respect:7,guard:16,selfEsteem:58,fightingSpirit:61,
 memories:[],history:[],lastReply:"",mode:"mock"
};
let S=JSON.parse(localStorage.getItem(STATE_KEY)||"null")||structuredClone(initial);

const SCENES={
 1:{title:"初対面",place:"雷神部屋・玄関",bg:"day1",expr:"neutral",outfit:"yukata",lead:"本場所初日。新任広報として雷神部屋に入ったあなたの前で、大きな男が足を止めた。",opening:"……新しい広報？　俺、取材とか苦手だから。",maxTurns:4,
 prompts:["初対面です。自由に話しかけてください。","剛ノ山はまだ帰らず、少しこちらを見ています。","少しだけ空気が柔らかくなりました。","帰り際です。最後に一言伝えられます。"],
 ending:"……明日も来るんだろ？"},
 2:{title:"小さな違和感",place:"国技館・支度部屋前",bg:"day2",expr:"neutral",outfit:"sumo",lead:"二日目。剛ノ山は連勝した。しかし支度部屋から出た瞬間だけ、左足に体重をかけるのを避けた。",opening:"……何見てる。別に何でもない。",maxTurns:5,
 prompts:["足のことに触れても、触れなくても構いません。","剛ノ山は平気なふりをしています。","話題を変えても構いません。","会話の途中、剛ノ山がコンビニ袋を持ち直しました。","プリンが二つあります。"],
 ending:"……いらないなら、俺が二個食う。"},
 3:{title:"初黒星",place:"雷神部屋・夜",bg:"day3",expr:"tired",outfit:"casual",lead:"三日目。初黒星。取材を終えた剛ノ山は、薄暗い部屋でスポーツドリンクを持ったまま座っている。",opening:"負けたやつに何言えばいいか、困るだろ。",maxTurns:5,
 prompts:["今の剛ノ山に何と言いますか？","剛ノ山は会話を終わらせません。","普段より少し本音が見えています。","剛ノ山はあなたの返答を待っています。","「勝てない力士って、価値ないと思うか？」"],
 ending:"……覚えとく。お前が今日言ったこと。"}
};

function save(){localStorage.setItem(STATE_KEY,JSON.stringify(S))}
function esc(s){return String(s).replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function clamp(n){return Math.max(0,Math.min(100,n))}
function condition(){if(S.injury>=25)return"左足に痛み";if(S.fatigue>=30)return"疲労あり";return"平常"}

const bg=document.getElementById("bg"),char=document.getElementById("char"),charArt=document.getElementById("charArt"),
log=document.getElementById("log"),lead=document.getElementById("lead"),input=document.getElementById("input"),sendBtn=document.getElementById("sendBtn"),
promptEl=document.getElementById("prompt"),emotionTag=document.getElementById("emotionTag"),controls=document.getElementById("controls");

function face(expr){
 const m={
 neutral:{b1:"M132 120 Q151 111 169 118",b2:"M211 118 Q231 111 248 120",e1:"M143 139 Q156 145 169 138",e2:"M216 138 Q229 145 242 139",mouth:"M177 181 Q192 183 207 181",blush:0},
 soft:{b1:"M132 120 Q151 114 169 120",b2:"M211 120 Q231 114 248 120",e1:"M143 140 Q156 147 169 140",e2:"M216 140 Q229 147 242 140",mouth:"M176 179 Q192 191 208 179",blush:0},
 blush:{b1:"M132 121 Q151 115 169 121",b2:"M211 121 Q231 115 248 121",e1:"M143 141 Q156 146 169 141",e2:"M216 141 Q229 146 242 141",mouth:"M181 183 Q192 189 203 183",blush:1},
 annoyed:{b1:"M132 125 L170 115",b2:"M211 115 L249 125",e1:"M143 142 Q156 146 169 140",e2:"M216 140 Q229 146 242 142",mouth:"M178 184 Q192 178 206 184",blush:0},
 tired:{b1:"M132 122 Q151 118 169 122",b2:"M211 122 Q231 118 248 122",e1:"M143 144 Q156 148 169 144",e2:"M216 144 Q229 148 242 144",mouth:"M179 184 Q192 182 205 184",blush:0},
 pain:{b1:"M132 127 L170 112",b2:"M211 112 L249 127",e1:"M143 144 Q156 151 169 142",e2:"M216 142 Q229 151 242 144",mouth:"M176 188 Q192 175 208 188",blush:0},
 serious:{b1:"M132 120 L170 117",b2:"M211 117 L249 120",e1:"M143 139 L169 139",e2:"M216 139 L242 139",mouth:"M178 183 L206 183",blush:0},
 smile:{b1:"M132 119 Q151 114 169 119",b2:"M211 119 Q231 114 248 119",e1:"M143 138 Q156 151 169 138",e2:"M216 138 Q229 151 242 138",mouth:"M174 177 Q192 196 211 177",blush:0}
 };return m[expr]||m.neutral;
}
function characterSVG(expr="neutral",outfit="yukata"){
 const f=face(expr);
 const outfitColor=outfit==="sumo"?"#8c2831":outfit==="casual"?"#3b4344":"#354a43";
 const chest=outfit==="sumo"
 ? `<path d="M90 210 Q118 174 154 169 Q192 159 229 169 Q267 176 292 211 L304 334 Q267 357 190 359 Q112 357 75 333Z" fill="#d19a74"/><path d="M88 300 Q130 282 190 285 Q250 282 293 301 L284 348 Q242 365 190 366 Q138 365 96 348Z" fill="#862934"/>`
 : `<path d="M90 210 Q118 174 154 169 Q192 159 229 169 Q267 176 292 211 L304 334 Q267 357 190 359 Q112 357 75 333Z" fill="${outfitColor}"/>
    ${outfit==="casual"?`<g transform="translate(174 267)" opacity=".8"><circle cx="15" cy="13" r="14" fill="#e5d1aa"/><path d="M5 4 L4 -7 L11 -2 M25 4 L27 -7 L20 -2" fill="#e5d1aa"/><circle cx="11" cy="11" r="1.4"/><circle cx="19" cy="11" r="1.4"/><path d="M12 17 Q15 19 18 17" fill="none" stroke="#65523f" stroke-width="1.4"/></g>`:""}`;
 const blush=f.blush?`<ellipse cx="145" cy="162" rx="16" ry="7" fill="#e98c84" opacity=".25"/><ellipse cx="240" cy="162" rx="16" ry="7" fill="#e98c84" opacity=".25"/>`:"";
 return `<svg viewBox="0 0 380 440" aria-label="剛ノ山">
 <path d="M116 330 Q96 391 101 437 H163 L174 334Z" fill="#483b32"/><path d="M206 334 L217 437 H279 Q286 391 264 330Z" fill="#483b32"/>
 ${chest}
 <path d="M91 218 Q54 241 48 301 Q52 325 74 322 Q87 284 118 260Z" fill="#c88f69"/>
 <path d="M290 218 Q327 241 333 301 Q329 325 307 322 Q293 284 263 260Z" fill="#c88f69"/>
 <path d="M155 176 L158 204 Q190 220 223 204 L225 175Z" fill="#c88f69"/>
 <ellipse cx="113" cy="140" rx="17" ry="24" fill="#c88f69"/><ellipse cx="268" cy="140" rx="17" ry="24" fill="#c88f69"/>
 <ellipse cx="190" cy="136" rx="79" ry="75" fill="#d59a74"/>
 <ellipse cx="190" cy="57" rx="39" ry="22" fill="#2e2925"/><ellipse cx="190" cy="29" rx="25" ry="17" fill="#2e2925"/>
 <path d="M119 120 Q124 65 190 60 Q257 65 263 119 Q238 91 190 92 Q143 91 119 120Z" fill="#2e2925"/>
 <path d="${f.b1}" fill="none" stroke="#3b302a" stroke-width="7" stroke-linecap="round"/><path d="${f.b2}" fill="none" stroke="#3b302a" stroke-width="7" stroke-linecap="round"/>
 <path d="${f.e1}" fill="none" stroke="#2a2521" stroke-width="5" stroke-linecap="round"/><path d="${f.e2}" fill="none" stroke="#2a2521" stroke-width="5" stroke-linecap="round"/>
 <path d="M189 143 Q181 161 192 165" fill="none" stroke="#a86e54" stroke-width="3" stroke-linecap="round"/>
 <path d="${f.mouth}" fill="none" stroke="#6f4137" stroke-width="4" stroke-linecap="round"/>${blush}
 <g opacity=".16" fill="#47362d">${Array.from({length:16},(_,i)=>`<circle cx="${154+(i%8)*10}" cy="${194+Math.floor(i/8)*9}" r="1.3"/>`).join("")}</g>
 </svg>`;
}
function setVisual(expr="neutral",gesture="still"){
 const sc=SCENES[S.day];charArt.innerHTML=characterSVG(expr,sc.outfit);
 char.className="char";
 if(["look_away","rub_neck"].includes(gesture))char.classList.add("lookaway");
 if(["step_closer","small_smile"].includes(gesture))char.classList.add("close");
 if(gesture==="flinch"){char.classList.add("bump");setTimeout(()=>char.classList.remove("bump"),500)}
}
function tag(text){if(!text)return;emotionTag.textContent=text;emotionTag.classList.add("show");setTimeout(()=>emotionTag.classList.remove("show"),1100)}
function bubble(type,text){
 const d=document.createElement("div");d.className=`bubble ${type}`;
 if(type==="gono")d.innerHTML=`<div class="speaker">剛ノ山</div>${esc(text)}`;
 else if(type==="you")d.innerHTML=`<div class="speaker">あなた</div>${esc(text)}`;
 else d.textContent=text;
 log.appendChild(d);d.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function typing(){
 const d=document.createElement("div");d.className="bubble gono";d.id="typing";d.innerHTML=`<div class="speaker">剛ノ山</div><div class="typing"><i></i><i></i><i></i></div>`;log.appendChild(d);d.scrollIntoView({behavior:"smooth",block:"nearest"})
}
function applyAI(r){
 ["affection","trust","respect","guard","selfEsteem","fightingSpirit"].forEach(k=>{
   const key=k+"_delta";if(typeof r[key]==="number")S[k]=clamp(S[k]+r[key]);
 });
 if(typeof r.injury_delta==="number")S.injury=clamp(S.injury+r.injury_delta);
 if(typeof r.fatigue_delta==="number")S.fatigue=clamp(S.fatigue+r.fatigue_delta);
 if((r.memory_importance||0)>=3 && r.memory_summary){
   S.memories.push({day:S.day,text:r.memory_summary,importance:r.memory_importance,raw:S.history.at(-1)?.player||""});
   S.memories=S.memories.slice(-12);
 }
}
async function askAI(playerText){
 const payload={
   day:S.day,turn:S.turn,scene:SCENES[S.day].title,player_text:playerText,
   state:{affection:S.affection,trust:S.trust,respect:S.respect,guard:S.guard,self_esteem:S.selfEsteem,fighting_spirit:S.fightingSpirit,injury:S.injury,fatigue:S.fatigue},
   memories:S.memories.slice(-8),
   recent_history:S.history.slice(-8)
 };
 if(API_BASE){
   try{
     const res=await fetch(`${API_BASE}/api/dialogue`,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify(payload)});
     if(!res.ok)throw new Error(await res.text());
     const data=await res.json();S.mode="live";document.getElementById("aiStatus").textContent="AI LIVE";document.getElementById("aiStatus").className="status live";return data;
   }catch(e){console.warn("AI backend unavailable; fallback to demo",e)}
 }
 S.mode="mock";document.getElementById("aiStatus").textContent="DEMO AI";document.getElementById("aiStatus").className="status mock";
 return mockReply(payload);
}
function mockReply(p){
 const t=p.player_text,day=p.day,turn=p.turn;
 const has=(arr)=>arr.some(x=>t.includes(x));
 let emotion="neutral",gesture="still",dialogue="",memory_importance=1,memory_summary="",trust_delta=0,affection_delta=0,respect_delta=0,guard_delta=0,selfEsteem_delta=0,fightingSpirit_delta=0;
 if(has(["好き","かっこいい","会いたい","大切"])){emotion="blush";gesture="look_away";affection_delta=8;trust_delta=2;memory_importance=4;memory_summary=`あなたは剛ノ山に好意を示した：「${t.slice(0,35)}」`;dialogue=day===1?"……初対面で何言ってんだ。":"……今それ言うの、反則だろ。";}
 else if(has(["心配","無理","休","痛","大丈夫"])){emotion=day===2?"annoyed":"soft";gesture="look_away";trust_delta=5;affection_delta=2;dialogue=day===2?"……大げさだ。相撲取ってりゃ、これくらい普通だ。":"……心配されるの、慣れてない。けど……ありがとな。";}
 else if(has(["価値","勝ち負け","結果だけ","相撲だけ"])){emotion="serious";gesture="still";trust_delta=8;selfEsteem_delta=7;memory_importance=5;memory_summary=`勝敗だけで剛ノ山の価値は決まらないという言葉：「${t.slice(0,48)}」`;dialogue=day===3?"……それ、本気で言ってるなら。……忘れたくない。":"……そういう考え方もあるのか。";}
 else if(has(["プリン","甘い","二個","2個"])){emotion="blush";gesture="look_away";affection_delta=4;dialogue="……一個、お前にやろうと思ってた。いらないなら俺が食う。";}
 else if(has(["頑張","勝","負けるな"])){emotion="serious";fightingSpirit_delta=5;respect_delta=2;dialogue=day===3?"……次は勝つ。そう言っとく。":"……言われなくてもやる。";}
 else if(has(["なんで","どうして","なぜ","？","?"])){emotion="serious";trust_delta=2;dialogue=day===3?"……分かんねえ。勝てない自分を見るのが、一番嫌なのかもな。":"……それ、今答えないと駄目か？";}
 else{
   const pools={
     1:["……そんなこと言う広報、初めて見た。","……お前、思ってたより普通に喋るんだな。","……変なやつ。まあ、嫌いじゃない。"],
     2:["……よく見てるな。","……そこまで気にするほどじゃない。","……ふっ。お前と話すと調子狂う。"],
     3:["……慰め方、下手だな。","……でも、黙って帰られるよりはマシか。","……もう少しだけ、話していけよ。"]
   };const pool=pools[day];dialogue=pool[(S.history.length+turn)%pool.length];
 }
 return {dialogue,emotion,gesture,trust_delta,affection_delta,respect_delta,guard_delta,selfEsteem_delta,fightingSpirit_delta,injury_delta:0,fatigue_delta:0,memory_importance,memory_summary,should_end_scene:false};
}
function render(){
 const sc=SCENES[S.day];
 bg.className=`bg ${sc.bg}`;document.getElementById("location").textContent=sc.place;document.getElementById("record").textContent=`${S.wins}勝${S.losses}敗`;document.getElementById("condition").textContent=condition();
 document.getElementById("dayLabel").textContent=`DAY ${S.day}`;document.getElementById("sceneTitle").textContent=sc.title;lead.textContent=sc.lead;
 log.innerHTML="";setVisual(sc.expr,"still");bubble("gono",sc.opening);promptEl.textContent=sc.prompts[S.turn]||"自由に話してください。";
 input.disabled=false;sendBtn.disabled=false;input.value="";
}
async function send(){
 const text=input.value.trim();if(!text)return;
 input.disabled=true;sendBtn.disabled=true;bubble("you",text);
 S.history.push({day:S.day,turn:S.turn,player:text});typing();
 const r=await askAI(text);
 const delay=S.mode==="live"?250:650;await new Promise(x=>setTimeout(x,delay));
 document.getElementById("typing")?.remove();applyAI(r);setVisual(r.emotion||"neutral",r.gesture||"still");
 const labels={blush:"目をそらした",soft:"少し表情がゆるんだ",annoyed:"眉をひそめた",tired:"疲れている",pain:"痛みをこらえている",serious:"真剣な顔"};
 tag(labels[r.emotion]||"");bubble("gono",r.dialogue);
 S.history[S.history.length-1].gono=r.dialogue;S.history[S.history.length-1].emotion=r.emotion;S.lastReply=r.dialogue;save();
 setTimeout(afterReply,250);
}
function afterReply(){
 const sc=SCENES[S.day];const nextTurn=S.turn+1;
 if(nextTurn<sc.maxTurns){
   const w=document.createElement("div");w.className="next";w.innerHTML=`<button>もう少し話す</button>`;log.appendChild(w);
   w.querySelector("button").onclick=()=>{w.remove();S.turn=nextTurn;promptEl.textContent=sc.prompts[S.turn]||"もう一言、自由に話してください。";
     if(S.day===2&&S.turn===3){bubble("narr","剛ノ山がコンビニ袋を持ち直した。中にはプリンが二つ見える。");setVisual("blush","look_away")}
     if(S.day===3&&S.turn===4){bubble("gono","お前はさ。……勝てない力士って、価値ないと思うか？");setVisual("serious","still")}
     input.disabled=false;sendBtn.disabled=false;input.value="";input.focus();save();
   };
 }else{
   bubble("narr",sc.ending);
   const w=document.createElement("div");w.className="next";w.innerHTML=`<button>${S.day===3?"プロローグを終える":"次の日へ"}</button>`;log.appendChild(w);
   w.querySelector("button").onclick=S.day===3?finish:nextDay;
 }
}
function nextDay(){
 const n=S.day+1,t=document.getElementById("transition");document.getElementById("transN").textContent=`Day ${n}`;document.getElementById("transT").textContent=SCENES[n].title;t.classList.add("show");
 setTimeout(()=>{S.day=n;S.turn=0;if(n===2){S.wins=2;S.injury=8}else if(n===3){S.wins=2;S.losses=1;S.fatigue=26;S.selfEsteem=clamp(S.selfEsteem-6)}save();t.classList.remove("show");render()},1100)
}
function finish(){
 controls.classList.add("hidden");bg.classList.add("blur");log.innerHTML="";lead.innerHTML="";
 const strong=S.memories.filter(m=>m.importance>=3);
 setVisual("serious","look_away");
 lead.outerHTML=`<div class="end"><div style="letter-spacing:.22em;font-size:11px;color:#8d2f2f;font-weight:900">PROLOGUE END</div><h1>三日目の夜</h1>
 <p style="line-height:1.8;color:#786c64">部屋に一人残った剛ノ山は、左足首に触れる。<br>そして、あなたとの会話を思い返した。</p>
 ${strong.length?strong.slice(-2).map(m=>`<div class="quote">「${esc(m.raw||m.text)}」</div>`).join(""):`<div class="quote">あなたが今日言った言葉が、まだ頭に残っている。</div>`}
 <p style="font-size:18px;font-weight:850">「……勝てない力士、か。」</p><h2>つづく</h2>
 <p style="font-size:12px;color:#786c64">Day4を遊びたいと思えたか、剛ノ山を少しでも気にするようになったか。それがこの縦切り版の検証ポイントです。</p>
 <button onclick="resetGame()">最初から遊ぶ</button></div>`;
}
document.getElementById("memoryBtn").onclick=()=>{
 const body=[...S.memories].reverse().map(m=>`<div class="memory"><b>Day ${m.day} / 重要度 ${m.importance}</b><br>${esc(m.text)}</div>`).join("")||"<p>まだ強く残った言葉はありません。</p>";
 showModal(`<button style="float:right" onclick="closeModal()">×</button><h2>剛ノ山の記憶</h2><p style="font-size:12px;color:#786c64">数値ではなく、後の会話で引用される可能性がある言葉です。</p>${body}`);
};
function showModal(h){document.getElementById("modal").innerHTML=h;document.getElementById("overlay").classList.add("show")}
function closeModal(){document.getElementById("overlay").classList.remove("show")}
function resetGame(){localStorage.removeItem(STATE_KEY);location.reload()}
document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")closeModal()}
document.getElementById("restartBtn").onclick=()=>showModal(`<button style="float:right" onclick="closeModal()">×</button><h2>最初から遊ぶ</h2><p>現在の会話・記憶を消して最初から始めます。</p><button onclick="resetGame()">リセットする</button>`);
sendBtn.onclick=send;
window.closeModal=closeModal;window.resetGame=resetGame;
render();save();
</script>
</body>
</html>
