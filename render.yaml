services:
  - type: web
    name: koibasho-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    envVars:
      - key: OPENAI_API_KEY
        sync: false
      - key: OPENAI_MODEL
        sync: false
      - key: CORS_ORIGIN
        value: https://YOUR_GITHUB_USERNAME.github.io
