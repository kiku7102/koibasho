<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#7e2727">
<title>恋場所 〜恋の決まり手〜 | 剛ノ山編</title>
<style>
:root{
  --paper:#fff9ef;--ink:#26211e;--muted:#756b63;--accent:#8c2f2e;--gold:#b88a3f;
  --line:#dfd1bd;--cream:#f4eadb;--green:#506b58;--shadow:0 12px 35px rgba(43,26,15,.16)
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:#ece1d3;color:var(--ink)}
button,textarea{font:inherit}
button{cursor:pointer}
.app{max-width:560px;min-height:100vh;margin:auto;background:var(--paper);box-shadow:0 0 50px rgba(55,32,15,.15);position:relative}
.header{position:sticky;top:0;z-index:20;padding:10px 12px 9px;background:rgba(255,249,239,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.brandrow{display:flex;justify-content:space-between;align-items:flex-end;gap:8px}
.brand{font-size:19px;font-weight:950;letter-spacing:.02em}.subtitle{font-size:10px;color:var(--muted);white-space:nowrap}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:8px}.hudbox{background:#fff;border:1px solid var(--line);border-radius:12px;padding:7px 8px;min-width:0}.hudbox b{font-size:11px;display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.hudbox span{display:block;font-size:10px;color:var(--muted);margin-top:2px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* Visual novel stage */
.stage{height:46vh;min-height:310px;max-height:460px;position:relative;overflow:hidden;background:#b6b0a4;border-bottom:1px solid rgba(0,0,0,.08)}
.stage-bg{position:absolute;inset:0;transition:background .5s ease,filter .5s ease}
.stage-bg::after{content:"";position:absolute;inset:0;background:linear-gradient(to bottom,rgba(255,255,255,.02) 40%,rgba(25,15,10,.22) 100%);pointer-events:none}
.bg-entrance{background:
 linear-gradient(90deg,transparent 0 10%,rgba(65,45,31,.18) 10% 12%,transparent 12% 88%,rgba(65,45,31,.18) 88% 90%,transparent 90%),
 linear-gradient(#d8c7a9 0 24%,#927454 24% 27%,#efe4cf 27% 74%,#b59772 74% 77%,#7b654d 77%)}
.bg-corridor{background:
 repeating-linear-gradient(90deg,rgba(255,255,255,.55) 0 68px,rgba(83,67,49,.15) 68px 72px),
 linear-gradient(#d7d6ce 0 18%,#6f736b 18% 21%,#d9d3c6 21% 78%,#777065 78%)}
.bg-night{background:
 radial-gradient(circle at 80% 20%,rgba(255,225,159,.45),transparent 15%),
 linear-gradient(#273244 0 38%,#5c5960 38% 40%,#c7b69c 40% 76%,#6c5745 76%)}
.bg-lounge{background:
 radial-gradient(circle at 78% 18%,rgba(255,245,209,.65),transparent 24%),
 linear-gradient(#d7c9b5 0 25%,#a28160 25% 28%,#e7dbc6 28% 74%,#8c745d 74%)}
.bg-medical{background:
 linear-gradient(90deg,transparent 0 70%,rgba(117,145,143,.18) 70% 72%,transparent 72%),
 linear-gradient(#d9e2df 0 20%,#9db6b1 20% 23%,#f4f4ee 23% 76%,#a6aaa3 76%)}
.scenery{position:absolute;inset:0;pointer-events:none}
.scenery .panel{position:absolute;border-radius:4px;background:rgba(255,255,255,.35);border:1px solid rgba(73,55,42,.18)}
.scenery .p1{left:7%;top:14%;width:18%;height:27%}.scenery .p2{right:8%;top:18%;width:21%;height:20%}
.stage-label{position:absolute;top:10px;left:12px;z-index:5;background:rgba(32,25,21,.72);color:#fff;padding:6px 9px;border-radius:999px;font-size:11px;backdrop-filter:blur(5px)}
.character-wrap{position:absolute;left:50%;bottom:-16px;transform:translateX(-50%);width:min(82%,410px);height:96%;z-index:3;transition:transform .35s ease,filter .35s ease}
.character-wrap.close{transform:translateX(-50%) scale(1.06)}
.character-wrap.far{transform:translateX(-50%) scale(.94)}
.character-wrap.shake{animation:shake .25s linear 2}
@keyframes shake{0%,100%{transform:translateX(-50%)}25%{transform:translateX(calc(-50% - 5px))}75%{transform:translateX(calc(-50% + 5px))}}
.character-svg{width:100%;height:100%;display:block;filter:drop-shadow(0 15px 11px rgba(42,25,13,.28))}
.character-name{position:absolute;right:11px;bottom:10px;z-index:6;background:rgba(255,249,239,.9);padding:7px 10px;border-radius:12px;box-shadow:0 5px 15px rgba(0,0,0,.08)}
.character-name b{display:block;font-size:13px}.character-name span{font-size:10px;color:var(--muted)}
.expression-pop{position:absolute;right:14px;top:48px;z-index:8;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:999px;padding:5px 8px;font-size:11px;opacity:0;transform:translateY(5px);transition:.25s}
.expression-pop.show{opacity:1;transform:none}

/* Story and dialogue */
.story{padding:12px 12px 225px}.intro{background:#fff;border:1px solid var(--line);border-radius:18px;padding:12px 13px;margin-bottom:10px;box-shadow:0 3px 14px rgba(62,34,15,.04)}
.daychip{display:inline-block;background:var(--accent);color:white;border-radius:999px;padding:4px 8px;font-size:10px;font-weight:900}.intro h2{font-size:18px;margin:8px 0 5px}.intro p{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
.dialogue-stack{display:grid;gap:8px}
.bubble{max-width:90%;padding:11px 12px;border-radius:17px;font-size:15px;line-height:1.64;box-shadow:0 3px 12px rgba(55,30,10,.04);white-space:pre-wrap}
.bubble.gono{justify-self:start;background:#fff;border:1px solid var(--line);border-bottom-left-radius:5px}.bubble.you{justify-self:end;background:#8c2f2e;color:#fff;border-bottom-right-radius:5px}.bubble.narration{max-width:100%;justify-self:stretch;background:#fff7df;border:1px solid #e6d4a8;color:#5f5547;font-size:13px;text-align:center}
.speaker{font-size:10px;font-weight:900;opacity:.7;margin-bottom:3px}.typing{display:flex;gap:5px;align-items:center;height:20px}.typing i{width:6px;height:6px;border-radius:50%;background:#786c61;animation:dot 1s infinite ease-in-out}.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}@keyframes dot{0%,60%,100%{opacity:.2;transform:translateY(0)}30%{opacity:1;transform:translateY(-4px)}}
.nextwrap{display:flex;justify-content:flex-end;margin-top:10px}.nextbtn{border:0;border-radius:14px;padding:11px 15px;background:#342720;color:#fff;font-weight:900}

/* Controls */
.controls{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);z-index:25;padding:9px 10px calc(9px + env(safe-area-inset-bottom));background:rgba(255,249,239,.96);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.prompt{font-size:11px;color:var(--muted);margin:0 2px 5px}textarea{width:100%;height:64px;resize:none;border:1px solid #cbbba7;background:#fff;border-radius:15px;padding:10px 11px;outline:none;font-size:15px}textarea:focus{border-color:var(--gold);box-shadow:0 0 0 3px rgba(184,138,63,.12)}
.btnrow{display:flex;gap:7px;margin-top:7px}button{border:0;border-radius:13px;padding:10px 11px;background:#e9dfd1;color:var(--ink);font-weight:850}.send{flex:1;background:var(--accent);color:#fff}.gold{background:#d9b76b}.small{font-size:11px}
button:disabled,textarea:disabled{opacity:.45}

/* special overlays */
.overlay{position:fixed;inset:0;background:rgba(27,18,13,.76);display:none;align-items:center;justify-content:center;padding:15px;z-index:60}.overlay.show{display:flex}.modal{background:var(--paper);width:min(500px,100%);max-height:84vh;overflow:auto;border-radius:22px;padding:18px;box-shadow:var(--shadow)}.closebtn{float:right}
.memory{background:#fff;border:1px solid var(--line);border-radius:12px;padding:10px;margin:7px 0;font-size:13px}
.day-transition{position:fixed;inset:0;background:#271d18;color:#fff;display:none;align-items:center;justify-content:center;text-align:center;z-index:70}.day-transition.show{display:flex}.day-transition .num{font-size:44px;font-weight:950}.day-transition .ttl{font-size:15px;opacity:.76;margin-top:5px}
.dohyo{position:fixed;inset:0;background:radial-gradient(circle at center,#5b4334 0 18%,#2c201a 48%,#18110e 100%);color:#fff;display:none;align-items:center;justify-content:center;text-align:center;z-index:80}.dohyo.show{display:flex}.dohyo .smallcap{letter-spacing:.35em;font-size:12px;opacity:.72}.dohyo h1{font-size:48px;margin:13px 0 5px;color:#f0cd80}.dohyo p{font-size:13px;opacity:.78}
.endcard{text-align:center;padding:20px}.endcard h1{font-size:32px}.resultbox{background:#fff;border:1px solid var(--line);border-radius:14px;padding:11px;margin:9px 0;text-align:left}
.hidden{display:none!important}
@media(max-height:700px){.stage{height:41vh;min-height:280px}.story{padding-bottom:210px}.character-wrap{width:74%}}

#character{
  width:100%;
  height:100%;
  min-height:100%;
  position:relative;
}
#character svg{
  width:100%;
  height:100%;
  display:block;
}

</style>
</head>
<body>
<div class="app">
  <div class="header">
    <div class="brandrow">
      <div class="brand">恋場所 〜恋の決まり手〜</div>
      <div class="subtitle">剛ノ山編 / visual prototype v3.1</div>
    </div>
    <div class="hud">
      <div class="hudbox"><b id="dayHud">Day 1</b><span id="placeHud">雷神部屋・玄関</span></div>
      <div class="hudbox"><b id="recordHud">1勝0敗</b><span>十両上位</span></div>
      <div class="hudbox"><b id="condHud">平常</b><span id="relHud">まだ距離がある</span></div>
    </div>
  </div>

  <section class="stage" id="stage">
    <div id="stageBg" class="stage-bg bg-entrance"></div>
    <div class="scenery"><div class="panel p1"></div><div class="panel p2"></div></div>
    <div class="stage-label" id="stageLabel">雷神部屋・玄関</div>
    <div class="expression-pop" id="expressionPop">……</div>
    <div class="character-wrap far" id="characterWrap"><div id="character"></div></div>
    <div class="character-name"><b>剛ノ山 剛志</b><span>27歳 / 188cm / 168kg</span></div>
  </section>

  <main class="story" id="story">
    <section class="intro" id="intro"></section>
    <section class="dialogue-stack" id="dialogue"></section>
  </main>

  <div class="controls" id="controls">
    <div class="prompt" id="promptText">あなたなら、何と言う？</div>
    <textarea id="input" placeholder="自分の言葉で話す"></textarea>
    <div class="btnrow">
      <button class="small" id="monoBtn">物言い</button>
      <button class="small gold" id="memoryBtn">記憶</button>
      <button class="send" id="sendBtn">話す</button>
    </div>
  </div>
</div>

<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="day-transition" id="dayTransition"><div><div class="num" id="transDay"></div><div class="ttl" id="transTitle"></div></div></div>
<div class="dohyo" id="dohyo"><div><div class="smallcap">KOIBASHO</div><h1>土俵際</h1><p>ここからの言葉は、明日にも残る。</p></div></div>

<script>
const KEY="koibasho_visual_v3";
const initialState={
  day:1,turn:0,wins:1,losses:0,aff:8,trust:6,respect:8,guard:12,self:55,fighting:55,injury:0,fatigue:8,
  memories:[],history:[],misread:null,flags:{day5Advice:null},currentExpression:"neutral"
};
let S=JSON.parse(localStorage.getItem(KEY)||"null")||structuredClone(initialState);

const DAYS={
1:{
 place:"雷神部屋・玄関",bg:"bg-entrance",title:"初日",expression:"neutral",distance:"far",
 intro:"本場所初日。新任広報として雷神部屋に入ったあなたの前に、大きな影が立ち止まる。",
 opening:"……新しい広報？　俺、取材とか苦手だから。",
 turns:[
   {prompt:"第一印象のまま、自由に返してみてください。",follow:"……変わってるな。普通、もう少し怖がるだろ。",expr:"neutral"},
   {prompt:"剛ノ山は少しだけこちらを見ています。もう一言、何か話しますか？",follow:"……まあ、仕事なら仕方ない。よろしく。",expr:"soft"}
 ]
},
2:{
 place:"国技館・支度部屋前",bg:"bg-corridor",title:"小さな違和感",expression:"pain",distance:"normal",
 intro:"二日目。剛ノ山は連勝した。しかし支度部屋から出た瞬間だけ、左足に体重をかけるのを避けた。",
 opening:"……何見てる。別に何でもない。",
 turns:[
   {prompt:"足のことに触れても、触れなくても構いません。",follow:"大げさだ。相撲取ってりゃ、これくらい普通だ。",expr:"annoyed"},
   {prompt:"会話が終わりかけた時、剛ノ山がコンビニ袋を持ち直しました。",special:"pudding",follow:"……プリン、食う？　二個買った。……別に二個とも俺のじゃない。",expr:"blush"}
 ]
},
3:{
 place:"雷神部屋・夜",bg:"bg-night",title:"初黒星",expression:"tired",distance:"normal",
 intro:"三日目。初黒星。取材を終えた剛ノ山は、薄暗い部屋でスポーツドリンクを持ったまま座っている。",
 opening:"負けたやつに何言えばいいか、困るだろ。",
 turns:[
   {prompt:"今の剛ノ山に、何と言いますか？",follow:"……そういう言い方するやつ、あんまりいないな。",expr:"tired"},
   {prompt:"剛ノ山は立ち上がらず、珍しく会話を終わらせません。",follow:"お前はさ。勝てないやつって、価値ないと思うか？",expr:"serious"}
 ]
},
4:{
 place:"雷神部屋・休憩室",bg:"bg-lounge",title:"言葉が返ってくる",expression:"annoyed",distance:"close",
 intro:"SNSには『期待外れ』『十両止まり』という文字。剛ノ山は画面を消したあと、あなたを見た。",
 openingDynamic:true,
 turns:[
   {prompt:"以前のあなたの言葉を、剛ノ山は覚えています。",follow:"……忘れてないんだな。俺は、結構覚えてる。",expr:"soft"},
   {prompt:"SNSの言葉より、あなたの反応を気にしているようです。",follow:"……もういい。ありがとな。",expr:"soft"}
 ]
},
5:{
 place:"国技館・医務室前",bg:"bg-medical",title:"第一の土俵際",expression:"pain",distance:"close",
 intro:"取組には勝った。だが左足を強く痛めた。医務室から出てきた剛ノ山は、壁に手をつきながら立っている。",
 opening:"明日も出る。これくらいで休んでたら、上には行けない。",
 critical:true,
 turns:[
   {prompt:"これは重大な会話です。休ませても、背中を押しても、本人に任せても正解とは限りません。",follow:"",expr:"pain"},
   {prompt:"剛ノ山はあなたの返事を聞いても、まだ迷っています。最後にもう一言だけ伝えられます。",follow:"……分かった。今夜、ちゃんと考える。",expr:"serious"}
 ]
}
};

const stageBg=document.getElementById("stageBg"), stageLabel=document.getElementById("stageLabel");
const character=document.getElementById("character"), characterWrap=document.getElementById("characterWrap"), expressionPop=document.getElementById("expressionPop");
const intro=document.getElementById("intro"), dialogue=document.getElementById("dialogue"), controls=document.getElementById("controls");
const input=document.getElementById("input"), sendBtn=document.getElementById("sendBtn"), promptText=document.getElementById("promptText");
const dayHud=document.getElementById("dayHud"),placeHud=document.getElementById("placeHud"),recordHud=document.getElementById("recordHud"),condHud=document.getElementById("condHud"),relHud=document.getElementById("relHud");

function save(){localStorage.setItem(KEY,JSON.stringify(S))}
function clamp(v){return Math.max(0,Math.min(100,v))}
function esc(s){return s.replace(/[&<>"]/g,m=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[m]))}
function relation(){if(S.guard>45)return"少し距離を置いている";if(S.trust>43)return"本音を見せ始めた";if(S.aff>25)return"少し気にしている";return"まだ距離がある"}
function condition(){if(S.injury>30)return"足を痛めている";if(S.fatigue>32)return"少し疲れている";return"平常"}
function updateHud(){
 const d=DAYS[S.day];dayHud.textContent=`Day ${S.day}`;placeHud.textContent=d.place;recordHud.textContent=`${S.wins}勝${S.losses}敗`;condHud.textContent=condition();relHud.textContent=relation();
}

function faceSVG(expr){
 const map={
 neutral:{browL:"M133 119 Q153 110 170 118",browR:"M211 118 Q229 110 246 119",eyeL:"M143 137 Q155 145 168 137",eyeR:"M216 137 Q228 145 240 137",mouth:"M177 179 Q190 183 205 179",blush:0},
 soft:{browL:"M133 119 Q153 113 170 119",browR:"M211 119 Q229 113 246 119",eyeL:"M143 138 Q155 147 168 138",eyeR:"M216 138 Q228 147 240 138",mouth:"M176 178 Q191 190 207 178",blush:0},
 blush:{browL:"M133 121 Q153 115 170 120",browR:"M211 120 Q229 115 246 121",eyeL:"M143 140 Q155 146 168 140",eyeR:"M216 140 Q228 146 240 140",mouth:"M181 182 Q191 188 202 182",blush:1},
 annoyed:{browL:"M133 123 L170 115",browR:"M211 115 L246 123",eyeL:"M143 141 Q155 145 168 139",eyeR:"M216 139 Q228 145 240 141",mouth:"M178 183 Q191 177 205 183",blush:0},
 tired:{browL:"M133 121 Q153 118 170 121",browR:"M211 121 Q229 118 246 121",eyeL:"M143 143 Q155 147 168 143",eyeR:"M216 143 Q228 147 240 143",mouth:"M179 183 Q191 181 204 183",blush:0},
 pain:{browL:"M133 126 L170 112",browR:"M211 112 L246 126",eyeL:"M143 143 Q155 151 168 141",eyeR:"M216 141 Q228 151 240 143",mouth:"M176 186 Q191 174 207 186",blush:0},
 serious:{browL:"M133 120 L170 117",browR:"M211 117 L246 120",eyeL:"M143 138 L168 138",eyeR:"M216 138 L240 138",mouth:"M178 182 L205 182",blush:0}
 }; return map[expr]||map.neutral;
}
function gonoSVG(expr="neutral"){
 const f=faceSVG(expr);
 const blush=f.blush?`<ellipse cx="145" cy="161" rx="15" ry="7" fill="#e98b82" opacity=".28"/><ellipse cx="239" cy="161" rx="15" ry="7" fill="#e98b82" opacity=".28"/>`:"";
 const painLeg=expr==="pain"?`<path d="M132 381 Q143 389 153 381" fill="none" stroke="#d25e5e" stroke-width="5" opacity=".75"/>`:"";
 return `<svg viewBox="0 0 380 440" class="character-svg" aria-label="剛ノ山の立ち絵">
 <defs><linearGradient id="robe" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#354942"/><stop offset="1" stop-color="#1f302b"/></linearGradient></defs>
 <!-- legs -->
 <path d="M116 330 Q96 390 101 437 H163 L174 333Z" fill="#473a31"/>
 <path d="M206 333 L217 437 H279 Q286 390 264 329Z" fill="#473a31"/>
 ${painLeg}
 <!-- massive torso -->
 <path d="M91 207 Q108 174 149 167 Q189 154 231 168 Q272 174 291 208 L307 332 Q273 358 190 359 Q108 358 74 331Z" fill="url(#robe)"/>
 <!-- shirt cat emblem -->
 <g transform="translate(177 269)" opacity=".75"><circle cx="13" cy="12" r="13" fill="#e8d4ac"/><path d="M3 3 L2 -7 L9 -2 M23 3 L25 -7 L18 -2" fill="#e8d4ac"/><circle cx="9" cy="10" r="1.5"/><circle cx="17" cy="10" r="1.5"/><path d="M10 16 Q13 18 16 16" fill="none" stroke="#6b5743" stroke-width="1.5"/></g>
 <!-- arms -->
 <path d="M92 217 Q54 240 49 301 Q52 323 73 321 Q86 283 118 259Z" fill="#c88f69"/>
 <path d="M289 217 Q327 240 332 301 Q329 323 308 321 Q294 283 263 259Z" fill="#c88f69"/>
 <!-- neck -->
 <path d="M156 176 L158 204 Q190 220 222 204 L224 175Z" fill="#c88f69"/>
 <!-- ears -->
 <ellipse cx="114" cy="139" rx="17" ry="24" fill="#c88f69"/><ellipse cx="267" cy="139" rx="17" ry="24" fill="#c88f69"/>
 <!-- face -->
 <ellipse cx="190" cy="135" rx="79" ry="75" fill="#d69c76"/>
 <!-- hair / mage -->
 <ellipse cx="190" cy="57" rx="38" ry="22" fill="#2f2925"/>
 <ellipse cx="190" cy="28" rx="25" ry="17" fill="#2f2925"/>
 <path d="M119 119 Q124 64 190 60 Q257 64 263 118 Q238 90 190 91 Q143 90 119 119Z" fill="#2f2925"/>
 <!-- facial features -->
 <path d="${f.browL}" fill="none" stroke="#3c3029" stroke-width="7" stroke-linecap="round"/>
 <path d="${f.browR}" fill="none" stroke="#3c3029" stroke-width="7" stroke-linecap="round"/>
 <path d="${f.eyeL}" fill="none" stroke="#2b2521" stroke-width="5" stroke-linecap="round"/>
 <path d="${f.eyeR}" fill="none" stroke="#2b2521" stroke-width="5" stroke-linecap="round"/>
 <path d="M189 143 Q181 161 192 164" fill="none" stroke="#a86e54" stroke-width="3" stroke-linecap="round"/>
 <path d="${f.mouth}" fill="none" stroke="#6f4137" stroke-width="4" stroke-linecap="round"/>
 ${blush}
 <!-- subtle stubble -->
 <g opacity=".17" fill="#47362d">${Array.from({length:16},(_,i)=>`<circle cx="${154+(i%8)*10}" cy="${193+Math.floor(i/8)*9}" r="1.3"/>`).join("")}</g>
 </svg>`;
}
function setExpression(expr,label=null){
 S.currentExpression=expr;character.innerHTML=gonoSVG(expr);
 if(label){expressionPop.textContent=label;expressionPop.classList.add("show");setTimeout(()=>expressionPop.classList.remove("show"),950)}
}
function addBubble(who,text,extra=""){
 const div=document.createElement("div");div.className=`bubble ${who} ${extra}`;
 if(who==="gono")div.innerHTML=`<div class="speaker">剛ノ山</div>${esc(text)}`;
 else if(who==="you")div.innerHTML=`<div class="speaker">あなた</div>${esc(text)}`;
 else div.textContent=text;
 dialogue.appendChild(div);div.scrollIntoView({behavior:"smooth",block:"nearest"});
}
function typing(){
 const div=document.createElement("div");div.className="bubble gono";div.id="typingBubble";div.innerHTML=`<div class="speaker">剛ノ山</div><div class="typing"><i></i><i></i><i></i></div>`;dialogue.appendChild(div);div.scrollIntoView({behavior:"smooth",block:"nearest"})
}
function removeTyping(){document.getElementById("typingBubble")?.remove()}
function remember(type,text,power=1){S.memories.push({day:S.day,type,text:text.slice(0,100),power});S.memories=S.memories.slice(-14)}
function has(t,a){return a.some(x=>t.includes(x))}
function analyze(t){
 let a={type:"neutral",aff:0,trust:0,respect:0,guard:0,self:0,fighting:0,expr:"neutral",reply:null,advice:null,kim:"寄り切り"};
 if(has(t,["心配","無理しない","休んで","大丈夫","痛い","そばに"]))Object.assign(a,{type:"care",trust:7,aff:4,fighting:-2,expr:"soft",kim:"寄り切り"});
 if(has(t,["頑張って","勝って","負けるな","絶対"]))Object.assign(a,{type:"push",fighting:7,respect:2,guard:2,expr:"annoyed",kim:"押し出し"});
 if(has(t,["価値","勝ち負けだけ","結果だけ","相撲だけじゃ","人として"]))Object.assign(a,{type:"value",trust:8,self:9,aff:3,expr:"serious",kim:"うっちゃり"});
 if(has(t,["自分で決め","任せる","あなたが決め","剛ノ山が決め"]))Object.assign(a,{type:"respect",respect:8,trust:4,expr:"serious",kim:"引き落とし"});
 if(has(t,["好き","大切","特別","会いたい","かっこいい"]))Object.assign(a,{type:"direct",aff:13,trust:2,expr:"blush",kim:"押し倒し"});
 if(has(t,["プリン","猫","でかい","かわいい","笑","面白い"]))Object.assign(a,{type:"humor",aff:4,guard:-2,expr:"soft",kim:"肩透かし"});
 if(has(t,["弱い","情けない","知らない","どうでもいい","辞めれば"]))Object.assign(a,{type:"hurt",guard:14,trust:-9,aff:-6,self:-7,expr:"annoyed",kim:"突き落とし"});
 if(has(t,["出た方","出るべき","無理してでも"]))a.advice="compete";
 if(has(t,["休んだ方","休場","休むべき","無理しない"]))a.advice="rest";
 return a;
}
function apply(a){
 ["aff","trust","respect","guard","self","fighting"].forEach(k=>S[k]=clamp(S[k]+(a[k]||0)));
}
function replyFor(a,t,turnData){
 const day=S.day,turn=S.turn;
 if(day===2&&turn===1)return turnData.follow;
 if(a.type==="care"){
   if(day===5 && S.self<52 && !has(t,["見限","諦め","大切","心配"])){S.misread={text:t,meaning:"見限られた"};return "……それ、俺にもう無理だって言ってるのか？";}
   return day===5?"……休めって言われる方が、怖いんだ。休んだら、本当に戻れない気がして。":"……心配されるの、慣れてない。けど……ありがとな。";
 }
 if(a.type==="push")return day===5?"……分かってる。勝ちたい。でも、足が言うこと聞かない。":"……頑張ってるつもりなんだけどな。まあ、言われなくてもやる。";
 if(a.type==="value")return day===3?"……相撲じゃない俺にも、価値あると思うのか。":"……お前、本当にそう思ってるんだな。";
 if(a.type==="respect")return "……俺が決める、か。そう言われると、逃げられないな。";
 if(a.type==="direct")return day===1?"……初日から何言ってんだ。":"……今それ言うの、反則だろ。";
 if(a.type==="humor")return day===2?"……ふっ。プリンで笑うな。":"……ふっ。変なやつ。";
 if(a.type==="hurt")return "……そうか。分かった。";
 // more context-sensitive neutral fallbacks
 const neutralByDay={
  1:["……そんなこと言う広報、初めて見た。","……まあ、嫌いじゃない。そういうの。"],
  2:["……よく見てるな。広報ってそういう仕事か？","……本当に大丈夫だ。たぶん。"],
  3:["……慰め方、下手だな。","……でも、黙って帰られるよりはマシか。"],
  4:["……お前の言葉の方が、あいつらの百倍うるさい。","……いや。悪い意味じゃない。"],
  5:["……それで納得できたら、楽なんだけどな。","……自分でも、何が正しいか分かってない。"]
 };
 const arr=neutralByDay[day];return arr[(S.history.length+turn)%arr.length]||turnData.follow;
}
function openingLine(){
 if(S.day===4){
   const important=[...S.memories].reverse().find(m=>m.type==="value"||m.power>=3);
   if(important)return `……前に「${important.text.slice(0,32)}」って言ってたよな。今でも、そう思うか。`;
   const prev=[...S.history].reverse().find(h=>h.day===3);
   if(prev)return `……昨日、お前「${prev.text.slice(0,28)}」って言ったよな。あれ、本気か。`;
 }
 return DAYS[S.day].opening;
}
function render(){
 const d=DAYS[S.day];updateHud();
 stageBg.className=`stage-bg ${d.bg}`;stageLabel.textContent=d.place;
 characterWrap.className=`character-wrap ${d.distance==="close"?"close":d.distance==="far"?"far":""}`;
 setExpression(d.expression);
 intro.innerHTML=`<span class="daychip">DAY ${S.day}</span><h2>${d.title}</h2><p>${d.intro}</p>`;
 dialogue.innerHTML="";S.turn=Math.min(S.turn,d.turns.length-1);
 addBubble("gono",openingLine());
 if(d.critical && S.turn===0)setTimeout(showDohyo,350);
 prepareTurn();
}
function prepareTurn(){
 const d=DAYS[S.day],td=d.turns[S.turn];
 promptText.textContent=td.prompt;input.disabled=false;sendBtn.disabled=false;input.value="";input.focus();
 if(td.special==="pudding"){
   addBubble("narration","剛ノ山が袋から小さなプリンを二つ取り出した。");
 }
}
function sendMessage(){
 const text=input.value.trim();if(!text)return;
 input.disabled=true;sendBtn.disabled=true;
 addBubble("you",text);
 const td=DAYS[S.day].turns[S.turn],a=analyze(text);apply(a);
 if(a.type==="value")remember("価値観",text,4);
 else if(a.type==="direct")remember("好意",text,4);
 else remember("会話",text,1);
 S.history.push({day:S.day,turn:S.turn,text,type:a.type});S.history=S.history.slice(-16);
 if(S.day===5&&a.advice)S.flags.day5Advice=a.advice;
 typing();setExpression(S.currentExpression);
 const delay=S.day===5?1550:950;
 setTimeout(()=>{
   removeTyping();
   const reply=replyFor(a,text,td);
   setExpression(a.expr,a.expr==="blush"?"照れている":a.expr==="pain"?"痛みをこらえている":a.expr==="soft"?"少し表情がゆるんだ":null);
   if(a.type==="hurt")characterWrap.classList.add("shake");
   setTimeout(()=>characterWrap.classList.remove("shake"),600);
   addBubble("gono",reply);
   if(S.day===5&&S.turn===0)addBubble("narration",`決まり手：${a.kim}　— ただし、これが正解とは限らない。`);
   save();
   setTimeout(afterReply,350);
 },delay);
}
function afterReply(){
 const d=DAYS[S.day];
 if(S.turn<d.turns.length-1){
   const wrap=document.createElement("div");wrap.className="nextwrap";wrap.innerHTML=`<button class="nextbtn">もう少し話す</button>`;
   dialogue.appendChild(wrap);wrap.querySelector("button").onclick=()=>{wrap.remove();S.turn++; const td=d.turns[S.turn]; if(td.special==="pudding"){addBubble("narration","会話が終わりかけた時、剛ノ山がコンビニ袋を持ち直した。");setExpression("blush","目をそらした");setTimeout(()=>addBubble("gono",td.follow),450);} prepareTurn();save();};
 }else{
   const wrap=document.createElement("div");wrap.className="nextwrap";
   wrap.innerHTML=`<button class="nextbtn">${S.day===5?"検証結果を見る":"次の日へ"}</button>`;dialogue.appendChild(wrap);
   wrap.querySelector("button").onclick=S.day===5?finish:nextDay;
 }
}
function nextDay(){
 const next=S.day+1;const tr=document.getElementById("dayTransition");
 document.getElementById("transDay").textContent=`Day ${next}`;document.getElementById("transTitle").textContent=DAYS[next].title;tr.classList.add("show");
 setTimeout(()=>{
   S.day=next;S.turn=0;
   if(next===2){S.wins=2;S.injury=7}
   if(next===3){S.wins=2;S.losses=1;S.self=clamp(S.self-6)}
   if(next===4){if(S.self+S.fighting>100)S.wins++;else S.losses++;S.fatigue+=7}
   if(next===5){S.wins++;S.injury=42;S.fatigue+=12}
   tr.classList.remove("show");save();render();
 },1100);
}
function showDohyo(){const d=document.getElementById("dohyo");d.classList.add("show");setTimeout(()=>d.classList.remove("show"),1600)}
function finish(){
 controls.classList.add("hidden");dialogue.innerHTML="";intro.innerHTML="";
 const advice=S.flags.day5Advice==="rest"?"休場を本気で考える":S.flags.day5Advice==="compete"?"無理して出場する可能性が高い":"本人が自分で決めようとしている";
 const strong=S.memories.filter(m=>m.power>=3).map(m=>`Day ${m.day}：「${esc(m.text)}」`).join("<br>")||"まだ決定的な言葉はない";
 intro.innerHTML=`<div class="endcard"><span class="daychip">DAY 1〜5 検証終了</span><h1>剛ノ山は、少し見えてきたか？</h1>
 <div class="resultbox"><b>Day6への状態</b><br>${advice}</div>
 <div class="resultbox"><b>現在の関係</b><br>${relation()}</div>
 <div class="resultbox"><b>強く残った記憶</b><br>${strong}</div>
 <p style="font-size:13px;color:var(--muted);line-height:1.65">この版の検証目的は「剛ノ山の顔・表情・仕草があるだけで、文字だけの版より心配や愛着が生まれるか」です。</p>
 <button onclick="resetGame()">最初から遊ぶ</button></div>`;
}
document.getElementById("monoBtn").onclick=()=>{
 if(!S.misread){showModal(`<button class="closebtn" onclick="closeModal()">×</button><h2>物言い</h2><p>今のところ、剛ノ山は明確な誤解をしていません。</p>`);return}
 showModal(`<button class="closebtn" onclick="closeModal()">×</button><h2>物言い</h2><p>剛ノ山は、あなたの言葉を「${esc(S.misread.meaning)}」と受け取っています。</p><p>最初の印象は残りますが、次の会話で意図を説明できます。</p>`);
};
document.getElementById("memoryBtn").onclick=()=>{
 const ms=[...S.memories].reverse().map(m=>`<div class="memory"><b>Day ${m.day} / ${m.type}</b><br>${esc(m.text)}</div>`).join("")||"<p>まだ記憶はありません。</p>";
 showModal(`<button class="closebtn" onclick="closeModal()">×</button><h2>剛ノ山の記憶</h2>${ms}<hr><button onclick="resetGame()">進行をリセット</button>`);
};
sendBtn.onclick=sendMessage;
function showModal(h){document.getElementById("modal").innerHTML=h;document.getElementById("overlay").classList.add("show")}
function closeModal(){document.getElementById("overlay").classList.remove("show")}
document.getElementById("overlay").onclick=e=>{if(e.target.id==="overlay")closeModal()}
function resetGame(){localStorage.removeItem(KEY);location.reload()}
window.closeModal=closeModal;window.resetGame=resetGame;
render();save();
</script>
</body>
</html>
