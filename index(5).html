<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>恋場所検証版 Day1-5</title>
<style>
:root{--paper:#fffaf0;--ink:#2a241f;--muted:#766c63;--accent:#8e2f2e;--gold:#b78c3e;--line:#ded0bd;--dark:#342720}
*{box-sizing:border-box} body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Yu Gothic",sans-serif;background:linear-gradient(#f7f0e6,#ebe0d1);color:var(--ink)}
.app{max-width:560px;min-height:100vh;margin:auto;background:rgba(255,250,240,.97);box-shadow:0 0 40px rgba(50,25,0,.12)}
header{position:sticky;top:0;z-index:5;background:rgba(255,250,240,.96);backdrop-filter:blur(12px);padding:13px 14px 10px;border-bottom:1px solid var(--line)}
.brand{font-size:20px;font-weight:900}.tag{font-size:12px;color:var(--muted);margin-top:2px}
.hud{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;margin-top:9px}.hud>div{background:#fff;border:1px solid var(--line);border-radius:13px;padding:8px}.hud b{display:block;font-size:12px}.hud span{font-size:11px;color:var(--muted)}
main{padding:16px 14px 220px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:15px;margin-bottom:12px}.system{border-left:4px solid var(--gold);background:#fff9e8}.dark{background:linear-gradient(135deg,#2f2521,#47342c);color:#fff;border:none;text-align:center}
.day{display:inline-block;background:var(--accent);color:#fff;border-radius:999px;padding:4px 9px;font-size:11px;font-weight:800}.place{font-size:12px;color:var(--muted);margin:8px 0}.title{font-size:21px;font-weight:900;margin-bottom:7px}.speaker{font-weight:900;margin-bottom:5px}.dialogue{font-size:17px;line-height:1.72;white-space:pre-wrap}.note{font-size:13px;color:var(--muted);line-height:1.62}
.big{font-size:31px;font-weight:900;color:#f0cd7f}.versus{font-size:22px;font-weight:900;margin:9px 0}.kim{font-size:29px;font-weight:900;color:var(--accent);text-align:center;margin:7px 0}
.controls{position:fixed;left:50%;transform:translateX(-50%);bottom:0;width:min(560px,100%);padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:rgba(255,250,240,.97);border-top:1px solid var(--line);z-index:6}
textarea{width:100%;min-height:70px;max-height:130px;resize:none;border:1px solid #c9b9a4;border-radius:16px;padding:12px;background:#fff}
.row{display:flex;gap:7px;margin-top:8px}button{border:0;border-radius:14px;padding:11px 12px;font-weight:800;background:#e8ded0}button.primary{background:var(--accent);color:#fff;flex:1}.small{font-size:12px;padding:9px}.gold{background:#dbba71}
.overlay{position:fixed;inset:0;background:rgba(32,20,12,.78);display:none;align-items:center;justify-content:center;padding:15px;z-index:20}.overlay.show{display:flex}.modal{width:min(500px,100%);max-height:86vh;overflow:auto;background:var(--paper);border-radius:22px;padding:18px}.close{float:right}
.memory{padding:10px;border-radius:12px;background:#fff;border:1px solid var(--line);margin:7px 0;font-size:13px}.ending{text-align:center;padding:18px}.ending h1{font-size:34px}.quote{border-left:4px solid var(--gold);background:#fff9e8;padding:12px;border-radius:10px;margin:10px 0}

.nextbar{margin-top:12px;display:flex;justify-content:flex-end}
.nextbar button{background:var(--accent);color:#fff}
.thinking{font-size:28px;letter-spacing:.25em;text-align:center;padding:10px 0;color:var(--muted)}
.dayTransition{position:fixed;inset:0;background:rgba(35,24,18,.96);color:#fff;z-index:50;display:none;align-items:center;justify-content:center;text-align:center;padding:20px}
.dayTransition.show{display:flex}
.dayTransition .dnum{font-size:44px;font-weight:900;margin-bottom:8px}
.dayTransition .dsub{font-size:15px;opacity:.8}

</style>
</head>
<body>
<div class="app">
<header>
<div class="brand">恋場所 〜恋の決まり手〜</div>
<div class="tag">検証版：Day 1〜5 / 会話を読んでから自分のペースで進める</div>
<div class="hud">
<div><b id="dayH">Day 1</b><span id="placeH">雷神部屋</span></div>
<div><b id="recordH">0勝0敗</b><span>十両上位</span></div>
<div><b id="condH">平常</b><span id="relH">まだ距離がある</span></div>
</div>
</header>
<main id="scene"></main>
<div class="controls" id="controls">
<textarea id="input" placeholder="あなたなら、何と言う？"></textarea>
<div class="row">
<button id="mono" class="small">物言い</button>
<button id="mem" class="small gold">記憶</button>
<button id="send" class="primary">言葉を届ける</button>
</div>
</div>
</div>
<div class="overlay" id="overlay"><div class="modal" id="modal"></div></div>
<div class="dayTransition" id="dayTransition"><div><div class="dnum" id="dayTransitionNum"></div><div class="dsub" id="dayTransitionSub"></div></div></div>
<script>
let S=JSON.parse(localStorage.getItem("dosukoi_validate")||"null")||{
day:1,wins:0,losses:0,aff:8,trust:6,respect:8,guard:12,self:55,fighting:55,injury:0,fatigue:8,
memories:[],statements:[],flags:{},history:[],misread:null
};

const D={
1:{place:"雷神部屋・玄関",title:"初日",intro:"本場所初日。あなたは雷神部屋の新しい広報担当として、剛ノ山と初めて顔を合わせる。",line:"……新しい広報？　俺、取材とか苦手だから。"},
2:{place:"国技館・支度部屋前",title:"小さな違和感",intro:"剛ノ山は連勝。しかし、帰り際に左足をわずかにかばった。",line:"……何見てる。別に何でもない。"},
3:{place:"雷神部屋・夜",title:"初黒星",intro:"三日目。剛ノ山は初めて負けた。記者対応を終え、無言でスポーツドリンクを飲んでいる。",line:"負けたやつに何言えばいいか、困るだろ。"},
4:{place:"雷神部屋・休憩室",title:"言葉が返ってくる",intro:"SNSでは『期待外れ』『十両止まり』という声。剛ノ山は無表情で画面を閉じた。",dynamic:true},
5:{place:"国技館・医務室前",title:"第一の土俵際",intro:"取組には勝った。しかし、左足を強く痛めた。剛ノ山は医務室を出てすぐ言った。",line:"明日も出る。これくらいで休んでたら、上には行けない。",torikumi:true}
};

function save(){localStorage.setItem("dosukoi_validate",JSON.stringify(S))}
function c(h,cl=""){scene.insertAdjacentHTML("beforeend",`<section class="card ${cl}">${h}</section>`)}
function say(n,t){c(`<div class="speaker">${n}</div><div class="dialogue">${t}</div>`)}
function sys(t){c(`<div class="note">${t}</div>`,"system")}
function match(){c(`<div class="note" style="color:#dbc59a">土俵際</div><div class="versus">東　あなた<br>VS<br>西　剛ノ山</div><div class="big">取 組</div>`,"dark")}
function clamp(v){return Math.max(0,Math.min(100,v))}
function relation(){if(S.guard>45)return"少し距離を置いている";if(S.trust>45)return"あなたには本音を見せ始めた";if(S.aff>25)return"あなたを気にしている";return"まだ距離がある"}
function updateHud(){dayH.textContent=`Day ${S.day}`;placeH.textContent=D[S.day]?.place||"雷神部屋";recordH.textContent=`${S.wins}勝${S.losses}敗`;condH.textContent=S.injury>25?"足を痛めている":S.fatigue>35?"少し疲れている":"平常";relH.textContent=relation()}
function remember(type,text,power=1){S.memories.push({day:S.day,type,text:text.slice(0,90),power});S.memories=S.memories.slice(-10)}
function statement(type,text){S.statements.push({day:S.day,type,text:text.slice(0,90)});S.statements=S.statements.slice(-10)}
function has(t,arr){return arr.some(x=>t.includes(x))}
function analyze(t){
 let a={type:"neutral",aff:0,trust:0,respect:0,guard:0,self:0,fighting:0,kim:"寄り切り",desc:"正面から言葉を届けた。"};
 if(has(t,["無理しなく","休んで","心配","痛い","大丈夫じゃ","そばに","話して"])) {a.type="care";a.trust+=8;a.aff+=4;a.fighting-=2;a.kim="寄り切り";a.desc="相手の状態に寄り添った。"}
 if(has(t,["頑張って","勝って","絶対いける","負けるな"])) {a.type="push";a.fighting+=8;a.respect+=2;a.guard+=3;a.kim="押し出し";a.desc="強く背中を押した。"}
 if(has(t,["勝ち負けだけじゃ","結果だけじゃ","相撲だけじゃ","価値","人として"])) {a.type="value";a.trust+=8;a.self+=10;a.aff+=3;a.kim="うっちゃり";a.desc="相手の自己評価を土俵際から返した。";statement("value",t);remember("価値観",t,4)}
 if(has(t,["自分で決め","あなたが決め","任せる"])) {a.type="respect";a.respect+=9;a.trust+=4;a.kim="引き落とし";a.desc="一歩引いて本人の意思を尊重した。";statement("autonomy",t)}
 if(has(t,["好き","大切","特別","会いたい"])) {a.type="direct";a.aff+=13;a.trust+=2;a.kim="押し倒し";a.desc="好意を真正面からぶつけた。";remember("好意",t,4)}
 if(has(t,["でかい","プリン","ちゃんこ","笑","変な"])) {a.type="humor";a.aff+=4;a.guard-=2;a.kim="肩透かし";a.desc="空気を少し軽くした。"}
 if(has(t,["弱い","情けない","知らない","どうでもいい","辞めれば"])) {a.type="hurt";a.guard+=14;a.trust-=9;a.aff-=6;a.self-=8;a.kim="突き落とし";a.desc="言葉が相手を傷つけた。"}
 if(has(t,["出た方","出るべき","無理してでも"])) {statement("compete",t);a.fighting+=7;a.advice="compete"}
 if(has(t,["休んだ方","休場","休むべき","無理しない"])) {statement("rest",t);a.advice="rest";a.trust+=2}
 return a;
}
function apply(a){S.aff=clamp(S.aff+a.aff);S.trust=clamp(S.trust+a.trust);S.respect=clamp(S.respect+a.respect);S.guard=clamp(S.guard+a.guard);S.self=clamp(S.self+a.self);S.fighting=clamp(S.fighting+a.fighting)}
function maybeMisread(a,t){
 // Day 5: low self-esteem can distort care into "being given up on"
 if(S.day===5 && a.type==="care" && S.self<52 && !has(t,["見限","諦め","大切","心配"])){
   S.misread={text:t,meaning:"見限られた"};
   return "……それ、俺にもう無理だって言ってるのか？";
 }
 return null;
}
function reply(a,t){
 let mis=maybeMisread(a,t); if(mis)return mis;
 if(S.guard>48)return "……今は、あんまり話したくない。";
 if(a.type==="care")return "……心配されるの、慣れてない。けど……ありがとな。";
 if(a.type==="push")return "……頑張ってるつもりなんだけどな。まあ、言われなくてもやる。";
 if(a.type==="value")return "……相撲じゃない俺にも、価値あると思うのか。";
 if(a.type==="respect")return "……俺が決める、か。そう言われると逃げられないな。";
 if(a.type==="direct")return "……今それ言うの、反則だろ。";
 if(a.type==="humor")return "……ふっ。変なやつ。";
 if(a.type==="hurt")return "……そうか。分かった。";
 return "……そうか。覚えとく。";
}
function sim(day){
 if(day===1){S.wins++;return}
 if(day===2){S.wins++;S.injury=7;return}
 if(day===3){S.losses++;S.self=clamp(S.self-7);return}
 if(day===4){ if(S.self+S.fighting>100)S.wins++;else S.losses++;S.fatigue+=8;return}
 if(day===5){S.wins++;S.injury=42;S.fatigue+=12;return}
}
function day4Line(){
 let m=[...S.memories].reverse().find(x=>x.type==="価値観");
 if(m)return `……前に「${m.text.slice(0,34)}」って言ってたよな。今でもそう思うか。`;
 let prev=S.history.find(x=>x.day===3);
 if(prev)return `……昨日、お前「${prev.text.slice(0,28)}」って言ったよな。あれ、本気か。`;
 return "……事実なら、別に腹も立たない。";
}
function render(){
 scene.innerHTML="";updateHud();let d=D[S.day];
 c(`<span class="day">DAY ${S.day}</span><div class="place">${d.place}</div><div class="title">${d.title}</div><div class="dialogue">${d.intro}</div>`);
 if(d.torikumi)match();
 say("剛ノ山",d.dynamic?day4Line():d.line);
 if(S.day===2)sys("足の違和感に触れても、触れなくても構いません。");
 if(S.day===4)sys("あなたの過去の言葉が、会話の材料として返ってきます。");
 if(S.day===5)sys("この場面では、剛ノ山があなたの言葉を誤解する可能性があります。正解はありません。");
 input.disabled=false;send.disabled=false;send.onclick=sendNow;
}
function sendNow(){
 let t=input.value.trim();if(!t)return;
 input.disabled=true;send.disabled=true;
 say("あなた",t);
 let a=analyze(t);apply(a);remember("会話",t,1);S.history.push({day:S.day,text:t,type:a.type});S.history=S.history.slice(-8);
 c(`<div class="thinking">……</div>`,"system");
 setTimeout(()=>{
   const think = scene.querySelector(".thinking")?.closest(".card");
   if(think) think.remove();
   let r=reply(a,t);say("剛ノ山",r);
   if([4,5].includes(S.day)){c(`<div class="note">決まり手</div><div class="kim">${a.kim}</div><div class="note" style="text-align:center">${a.desc}</div>`)}
   if(S.day===5){
     S.flags.day5Advice=a.advice||a.type;
     localStorage.setItem("dosukoi_validate",JSON.stringify(S));
     c(`<div class="nextbar"><button onclick="finish()">検証結果を見る</button></div>`);
     input.value="";
     return;
   }
   input.value="";
   save();
   c(`<div class="nextbar"><button onclick="goNextDay()">次へ</button></div>`);
 },900);
}

function goNextDay(){
  const next=S.day+1;
  const tr=document.getElementById("dayTransition");
  document.getElementById("dayTransitionNum").textContent=`Day ${next}`;
  document.getElementById("dayTransitionSub").textContent=D[next]?.title||"";
  tr.classList.add("show");
  setTimeout(()=>{
    S.day=next;
    sim(S.day);
    save();
    tr.classList.remove("show");
    render();
  },1200);
}

function finish(){
 controls.style.display="none";
 scene.innerHTML="";
 let advice=S.flags.day5Advice;
 let next=advice==="rest"?"休場を本気で考える可能性が高い":advice==="compete"?"無理して出場する可能性が高い":advice==="respect"?"本人判断へ。信頼と尊敬は比較的高い":"本人の性格と現在の心理で決断";
 let mem=S.memories.filter(x=>x.power>=4).map(x=>`Day ${x.day}：「${x.text}」`).join("<br>")||"強い記憶はまだ少ない";
 c(`<div class="ending">
 <div class="note">DAY 1〜5 検証終了</div>
 <h1>土俵際</h1>
 <p>ここまでの会話から、Day 6以降の分岐はこうなります。</p>
 <div class="quote"><b>剛ノ山の次の行動</b><br>${next}</div>
 <div class="quote"><b>関係</b><br>${relation()}</div>
 <div class="quote"><b>強く残った記憶</b><br>${mem}</div>
 <p class="note">完成版では、この状態からDay 6の出場判断・怪我・勝敗・引退意識へ連鎖します。</p>
 <button onclick="resetGame()">別の言葉で検証する</button>
 </div>`);
}
mono.onclick=()=>{
 if(!S.misread){show(`<button class="close" onclick="closeM()">×</button><h2>物言い</h2><p>今のところ明確な誤解は起きていません。</p>`);return}
 show(`<button class="close" onclick="closeM()">×</button><h2>物言い</h2><p>剛ノ山はあなたの発言を「${S.misread.meaning}」と受け取っています。</p><p class="note">閉じたあと、別の言葉で意図を説明してください。最初の印象は完全には消えません。</p>`);
 S.trust=clamp(S.trust+1);
}
mem.onclick=()=>{
 let m=S.memories.slice().reverse().map(x=>`<div class="memory"><b>Day ${x.day} / ${x.type}</b><br>${x.text}</div>`).join("")||"<p>まだありません。</p>";
 show(`<button class="close" onclick="closeM()">×</button><h2>剛ノ山の記憶</h2>${m}`);
}
function show(h){modal.innerHTML=h;overlay.classList.add("show")}function closeM(){overlay.classList.remove("show")}
overlay.onclick=e=>{if(e.target.id==="overlay")closeM()}
function resetGame(){localStorage.removeItem("dosukoi_validate");location.reload()}
window.closeM=closeM;window.resetGame=resetGame;window.goNextDay=goNextDay;window.finish=finish;
if(!localStorage.getItem("dosukoi_validate"))sim(1);
render();save();
</script>
</body>
</html>
